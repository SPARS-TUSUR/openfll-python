name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/PyFLL/**"
      - "src/openfll/__init__.py"
      - "src/openfll/__init__.pyi"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "src/PyFLL/**"
      - "src/openfll/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: |
          python -m pip install --no-compile --requirement docs/requirements.txt
          python -m pip check

      - name: Check import without native extension
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import sys
          import PyFLL
          assert "PyFLL._core" not in sys.modules
          assert PyFLL.SugenoEngine.__module__ == "PyFLL"
          assert PyFLL.BaseLinearEngine.add_input_var.__doc__
          try:
              PyFLL.SugenoEngine()
          except ImportError:
              pass
          else:
              raise AssertionError("Native extension is required for calculations")
          PY

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

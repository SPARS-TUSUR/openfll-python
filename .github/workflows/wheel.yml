name: Build wheels

# Сборка wheel для Python 3.14 (MinGW-build) через cibuildwheel.
# Триггеры:
#   - workflow_dispatch: ручной запуск
#   - push в main: после тега — для GitHub Release
#   - release: опубликованный GitHub Release — собрать и прикрепить wheel

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build on Python 3.14
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pybind11
            mingw-w64-x86_64-ccache

      - name: Build C++ extension
        shell: bash
        run: |
          set -e
          PYTHON_EXE=/mingw64/bin/python.exe
          echo "Using Python: $PYTHON_EXE"
          cmake -S . -B build_release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DPython3_EXECUTABLE="$PYTHON_EXE"
          cmake --build build_release -j 4 --target PyFLL
          # Проверяем, что .pyd создан
          ls -la build_release/src/PyFLL/*.pyd

      - name: Copy .pyd into package
        shell: bash
        run: |
          PYD=$(ls build_release/src/PyFLL/PyFLL.cp314-*.pyd)
          cp "$PYD" "src/openfll/$(basename $PYD | sed 's/^PyFLL/openfll/')"
          # Копируем MinGW runtime DLL
          cp /mingw64/bin/libstdc++-6.dll      src/openfll/
          cp /mingw64/bin/libgcc_s_seh-1.dll    src/openfll/
          cp /mingw64/bin/libwinpthread-1.dll  src/openfll/
          cp /mingw64/bin/libpython3.14.dll    src/openfll/
          ls -la src/openfll/

      - name: Build wheel with cibuildwheel
        shell: bash
        run: |
          pip install cibuildwheel
          cibuildwheel --output-dir wheelhouse/ \
            --build "cp314-*" \
            --skip "*-musllinux_* *-manylinux_i686 pp*" \
            -e "OPENFLL_PYTHON=3.14" \
            .

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-py314
          path: wheelhouse/*.whl

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl

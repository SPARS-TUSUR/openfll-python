name: Build and publish wheel

# Production publication happens only for a published GitHub Release.
# A manual run can either build the wheel without publishing it or upload it
# to TestPyPI. PyPI authentication uses Trusted Publishing (OIDC), so no
# long-lived PyPI token is stored in GitHub.
on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Optional package index for a manual test release
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
  release:
    types: [published]

jobs:
  build_windows_wheel:
    name: Build Windows / CPython ${{ matrix.python-version }} wheel
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Python package
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private C++ backend
        uses: actions/checkout@v4
        with:
          repository: SPARS-TUSUR/fuzzy-logic-library
          # Pin the reviewed backend revision so release builds are reproducible.
          ref: c83d87d1864fd57b9efce006ae33f9ee0b11dbe0
          path: fuzzy-logic-library
          submodules: recursive
          token: ${{ secrets.OPENFLL_BACKEND_TOKEN_SECRET || github.token }}

      - name: Set up CPython ${{ matrix.python-version }} x64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Set up UCRT64 GCC toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Apply official CPython compatibility patch
        shell: pwsh
        run: |
          git -C fuzzy-logic-library apply --check ../packaging/cpython-windows.patch
          git -C fuzzy-logic-library apply ../packaging/cpython-windows.patch

      - name: Validate release metadata
        shell: pwsh
        run: |
          $projectName = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])"
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"

          if ($projectName -ne "openfll_python") {
            throw "Unexpected distribution name: $projectName"
          }

          if ("${{ github.event_name }}" -eq "release") {
            $expectedTag = "v$version"
            $actualTag = "${{ github.event.release.tag_name }}"
            if ($actualTag -ne $expectedTag) {
              throw "Release tag $actualTag does not match package version $version (expected $expectedTag)."
            }
          }

      - name: Configure native backend with UCRT64 GCC
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $pythonExe = (Get-Command python).Source
          $ucrtBin = Join-Path $env:MSYS2_LOCATION "ucrt64/bin"
          & "$ucrtBin/cmake.exe" `
            -S fuzzy-logic-library `
            -B fuzzy-logic-library/build_release `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$ucrtBin/gcc.exe" `
            -DCMAKE_CXX_COMPILER="$ucrtBin/g++.exe" `
            -DCMAKE_MAKE_PROGRAM="$ucrtBin/ninja.exe" `
            -DPython3_EXECUTABLE="$pythonExe" `
            -DOPENFLL_BUILD_BENCHMARKS=OFF

      - name: Build and test C++ core and native backend
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ucrtBin = Join-Path $env:MSYS2_LOCATION "ucrt64/bin"
          $env:Path = "$ucrtBin;$env:Path"
          & "$ucrtBin/cmake.exe" `
            --build fuzzy-logic-library/build_release `
            --target unit_tests PyFLL `
            --parallel 4
          & "fuzzy-logic-library/build_release/tests/unit_tests.exe" --gtest_brief=1

      - name: Assemble bundled PyFLL backend package
        shell: pwsh
        run: |
          $pyTag = python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')"
          $soabi = "${pyTag}-win_amd64"
          $buildRoot = "fuzzy-logic-library/build_release/src/PyFLL"
          $core = Get-ChildItem $buildRoot -Recurse -Filter "_core.$soabi.pyd" |
            Select-Object -First 1
          $stub = Get-ChildItem $buildRoot -Recurse -Filter "PyFLL.pyi" |
            Select-Object -First 1

          if (-not $core) {
            throw "CPython $pyTag win_amd64 backend was not produced."
          }
          if (-not $stub) {
            throw "PyFLL.pyi was not produced."
          }

          # Проверяем путь и заменяем только старые нативные файлы.
          $backendDir = (Resolve-Path "src/PyFLL").Path
          Get-ChildItem -LiteralPath $backendDir -File |
            Where-Object { $_.Extension -in ".pyd", ".dll" } |
            Remove-Item -Force
          Copy-Item "fuzzy-logic-library/src/PyFLL/__init__.py" "src/PyFLL/"
          Copy-Item $stub.FullName "src/PyFLL/"
          Copy-Item $stub.FullName "src/PyFLL/__init__.pyi"
          Copy-Item $stub.FullName "src/openfll/PyFLL.pyi"
          Copy-Item $core.FullName "src/PyFLL/"

          $buildInfoPath = "src/PyFLL/backend_build.json"
          $buildInfo = Get-Content -LiteralPath $buildInfoPath -Raw | ConvertFrom-Json
          $buildInfo.python = python -c "import platform; print(platform.python_version())"
          $buildInfo.soabi = $soabi
          $buildInfo | ConvertTo-Json | Set-Content -LiteralPath $buildInfoPath -Encoding utf8

          Get-ChildItem $core.DirectoryName -Filter "*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "src/PyFLL/"
          Get-ChildItem "src/PyFLL"

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade build twine
          python -m build --wheel --outdir wheelhouse

      - name: Validate wheel metadata
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "wheelhouse/*.whl"
          if ($wheel.Count -ne 1) {
            throw "Expected exactly one wheel, found $($wheel.Count)."
          }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $pyTag = python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')"
          $expectedWheelName = "openfll_python-$version-$pyTag-$pyTag-win_amd64.whl"
          if ($wheel.Name -ne $expectedWheelName) {
            throw "Unexpected wheel name: $($wheel.Name) (expected $expectedWheelName)"
          }
          python -m twine check $wheel.FullName

      - name: Install and test built wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem "wheelhouse/*.whl").FullName
          python -m pip install --force-reinstall $wheel
          python -m pip install "pytest>=7.0" "scikit-learn>=1.3.0" "openpyxl>=3.1,<4" "matplotlib>=3.8" "simpful==2.12.0"
          python -m pytest tests -v
          python -c "from importlib.metadata import version; import tomllib; assert version('openfll_python') == tomllib.load(open('pyproject.toml', 'rb'))['project']['version']"
          python -c "import openfll, PyFLL; assert PyFLL.SugenoEngine.__module__ == 'PyFLL._core'"
          python examples/05_serialization_demo.py --output-dir build/demo_models

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfll-python-windows-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  build_linux_wheel:
    name: Build Linux / CPython ${{ matrix.python-version }} wheel
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Python package
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private C++ backend
        uses: actions/checkout@v4
        with:
          repository: SPARS-TUSUR/fuzzy-logic-library
          # Pin the reviewed backend revision so release builds are reproducible.
          ref: c83d87d1864fd57b9efce006ae33f9ee0b11dbe0
          path: fuzzy-logic-library
          submodules: recursive
          token: ${{ secrets.OPENFLL_BACKEND_TOKEN_SECRET || github.token }}

      - name: Set up CPython ${{ matrix.python-version }} x64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install build tools and auditwheel
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential patchelf

      - name: Validate release metadata
        run: |
          projectName=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")

          if [ "$projectName" != "openfll_python" ]; then
            echo "Unexpected distribution name: $projectName"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            expectedTag="v$version"
            actualTag="${{ github.event.release.tag_name }}"
            if [ "$actualTag" != "$expectedTag" ]; then
              echo "Release tag $actualTag does not match package version $version (expected $expectedTag)."
              exit 1
            fi
          fi

      - name: Configure native backend with GCC
        run: |
          pythonExe="$(which python)"
          cmake \
            -S fuzzy-logic-library \
            -B fuzzy-logic-library/build_release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++" \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DPython3_EXECUTABLE="$pythonExe" \
            -DOPENFLL_BUILD_BENCHMARKS=OFF

      - name: Build and test C++ core and native backend
        run: |
          cmake \
            --build fuzzy-logic-library/build_release \
            --target unit_tests PyFLL \
            --parallel 4
          fuzzy-logic-library/build_release/tests/unit_tests --gtest_brief=1

      - name: Assemble bundled PyFLL backend package
        run: |
          buildRoot="fuzzy-logic-library/build_release/src/PyFLL"
          core=$(find "$buildRoot" -name "_core.*.so" | head -n 1)
          stub="$buildRoot/PyFLL.pyi"

          if [ -z "$core" ]; then
            echo "Linux native backend was not produced."
            exit 1
          fi

          rm -f src/PyFLL/*.pyd src/PyFLL/*.so src/PyFLL/*.dll
          cp fuzzy-logic-library/src/PyFLL/__init__.py src/PyFLL/
          cp "$stub" src/PyFLL/
          cp "$stub" src/PyFLL/__init__.pyi
          cp "$stub" src/openfll/PyFLL.pyi
          cp "$core" src/PyFLL/

          python -c "
          import json, platform, sysconfig
          p = 'src/PyFLL/backend_build.json'
          data = json.load(open(p))
          data['python'] = platform.python_version()
          data['soabi'] = sysconfig.get_config_var('SOABI')
          json.dump(data, open(p, 'w'), indent=2)
          "
          ls -la src/PyFLL

      - name: Build and repair Linux wheel
        run: |
          python -m pip install --upgrade build auditwheel twine
          python -m build --wheel --outdir dist_raw
          mkdir -p wheelhouse
          auditwheel repair dist_raw/*.whl --wheel-dir wheelhouse/
          python -m twine check wheelhouse/*.whl

      - name: Install and test built wheel
        run: |
          wheel=$(ls wheelhouse/*.whl | head -n 1)
          python -m pip install --force-reinstall "$wheel"
          python -m pip install "pytest>=7.0" "scikit-learn>=1.3.0" "openpyxl>=3.1,<4" "matplotlib>=3.8" "simpful==2.12.0"
          python -m pytest tests -v
          python -c "from importlib.metadata import version; import tomllib; assert version('openfll_python') == tomllib.load(open('pyproject.toml', 'rb'))['project']['version']"
          python -c "import openfll, PyFLL; assert PyFLL.SugenoEngine.__module__ == 'PyFLL._core'"
          python examples/05_serialization_demo.py --output-dir build/demo_models

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfll-python-linux-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  attach_release_assets:
    name: Attach wheels to GitHub Release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build_windows_wheel, build_linux_wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openfll-python-*
          path: dist
          merge-multiple: true

      - name: Attach wheels
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  publish_testpypi:
    name: Publish wheels to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    needs: [build_windows_wheel, build_linux_wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/openfll-python
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openfll-python-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish_pypi:
    name: Publish wheels to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build_windows_wheel, build_linux_wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openfll-python
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openfll-python-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfll_python"
version = "0.2.0"
description = "Python bindings for OpenFLL fuzzy logic library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "SPARS-TUSUR" },
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.0",
]
keywords = ["fuzzy-logic", "sugeno", "openfll", "bindings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
sklearn = [
    "scikit-learn>=1.3.0",
]
test = [
    "pytest>=7.0",
    "scikit-learn>=1.3.0",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.8",
]

[project.urls]
Source = "https://github.com/SPARS-TUSUR/openfll-python"
Documentation = "https://spars-tusur.github.io/openfll-python/"
Issues = "https://github.com/SPARS-TUSUR/openfll-python/issues"

# ============================================================================
# setuptools — какие файлы включать в wheel
# ============================================================================
[tool.setuptools]
platforms = ["win_amd64"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openfll*", "PyFLL*"]

[tool.setuptools.package-data]
"openfll" = [
    "*.pyi",     # public type stubs для IDE
]
"PyFLL" = [
    "*.pyd",     # native backend: PyFLL._core (cp314)
    "*.so",      # на случай Linux
    "*.dll",     # MinGW runtime (libstdc++-6.dll и т.д.)
    "*.pyi",     # backend type stubs для IDE
]

# ============================================================================
# cibuildwheel — сборка wheels для разных Python
# ============================================================================
[tool.cibuildwheel]
# Собирать для Windows, только cp314 (MinGW-Python 3.14).
build = "cp314-*"
skip = "*-musllinux_* *-manylinux_i686 pp*"
build-frontend = { name = "build", args = ["--wheel"] }

# C++ часть собирается отдельным job-ом (см. .github/workflows/wheel.yml),
# а backend package PyFLL копируется в src/PyFLL/ перед запуском cibuildwheel.
# Test the wheels by importing openfll and running a smoke test.
test-requires = ["pytest", "numpy", "scikit-learn", "openpyxl>=3.1,<4", "matplotlib>=3.8"]
test-command = "pytest {project}/tests -v"

[tool.cibuildwheel.overrides]
"cp314-*" = { environment = { OPENFLL_PYTHON = "3.14" } }
